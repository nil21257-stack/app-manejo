<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Manejo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#155e52">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App Manejo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --surface:#ffffff; --fg:#17231f; --muted:#5b6b64;
    --line:#e1ddd2; --accent:#155e52; --accent-soft:#e3efe9; --accent-fg:#ffffff; --amber:#c98a1f;
    --ok:#2f7a4f; --ok-soft:#e5f3e8; --pending:#9a9488;
    --font-display:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1715; --surface:#172420; --fg:#eef1ee; --muted:#9cada3;
      --line:#28362f; --accent:#4fb3a0; --accent-soft:#1c322c; --accent-fg:#0b1b17; --amber:#e3a84a;
      --ok:#5fbf84; --ok-soft:#163023; --pending:#6b7772;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:var(--font-body);
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  .wrap{max-width:640px; margin:0 auto;}
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg); padding:14px 0 10px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:38px; height:38px; border-radius:11px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent-fg); flex:none;}
  .brand .logo svg{width:22px; height:22px;}
  .brand h1{font-family:var(--font-display); font-size:19px; font-weight:800; margin:0; letter-spacing:.1px;}
  .brand small{display:block; color:var(--muted); font-size:12px; margin-top:1px;}
  #install-btn{
    margin-left:auto; border:1px solid var(--accent); background:transparent; color:var(--accent);
    border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  #install-btn[hidden]{display:none;}

  .profile-row{display:flex; gap:8px; margin-top:12px; align-items:center;}
  .profile-row label{font-size:12px; color:var(--muted); white-space:nowrap;}
  select, input[type=text], input[type=url], textarea{
    font-family:inherit; font-size:14px; color:var(--fg); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%;
  }
  select{flex:1;}

  .tabs{display:flex; gap:6px; margin:14px 0 16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px;}
  .tab{flex:1; text-align:center; padding:8px 4px; border-radius:7px; font-family:var(--font-display); font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; user-select:none; transition:background .15s, color .15s;}
  .tab.active{background:var(--accent); color:var(--accent-fg);}

  .stage-progress{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .bar{flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .bar > span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s;}
  .stage-progress b{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .module{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; transition:border-color .2s, background .2s;}
  .module.complete{border-color:var(--ok); background:var(--ok-soft);}
  .module-head{display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer;}
  .module-head .icn{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; transition:background .2s, color .2s;}
  .module-head .icn svg{width:20px; height:20px;}
  .module.complete .module-head .icn{background:var(--ok); color:var(--accent-fg);}
  .module-head .title{flex:1; min-width:0; font-family:var(--font-display); font-size:15px; font-weight:700;}
  .module-head .count{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; display:flex; align-items:center; gap:4px;}
  .module.complete .module-head .count{color:var(--ok); font-weight:700;}
  .chev{transition:transform .2s; color:var(--muted); flex:none;}
  .module.open .chev{transform:rotate(90deg);}
  .module-body{display:none; padding:0 14px 14px; border-top:1px solid var(--line);}
  .module.open .module-body{display:block;}

  .video-box{margin:12px 0; padding:10px; border:1px dashed var(--line); border-radius:9px; background:var(--bg);}
  .video-box.has-video{border-style:solid; border-color:var(--ok);}
  .video-box .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  .video-box a.vlink{color:var(--accent); font-weight:600; font-size:13.5px; word-break:break-all;}
  .video-box .pending{color:var(--pending); font-size:13px; font-style:italic;}
  .drive-warning{margin-top:8px; padding:7px 9px; background:var(--amber); color:#1a1200; font-size:11.5px; font-weight:600; line-height:1.4; border-radius:6px;}
  @media (prefers-color-scheme: dark){ .drive-warning{color:#1a1200;} }
  .video-box .vrow{display:flex; gap:6px; margin-top:8px;}
  .video-box .vrow input{flex:1;}
  .video-box .vrow button{border:none; background:var(--accent); color:var(--accent-fg); border-radius:7px; padding:0 12px; font-size:12.5px; font-weight:600; cursor:pointer;}

  ul.checklist{list-style:none; margin:10px 0 0; padding:0;}
  ul.checklist li{display:flex; align-items:flex-start; gap:9px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.8px;}
  ul.checklist li:last-child{border-bottom:none;}
  ul.checklist input[type=checkbox]{width:18px; height:18px; margin-top:1px; accent-color:var(--accent); flex:none;}
  ul.checklist li.checked > div > span{color:var(--muted); text-decoration:line-through;}
  ul.checklist li > div{flex:1; min-width:0;}
  .howto-note{font-size:13px; color:var(--fg); line-height:1.5; margin-top:5px; padding:8px 9px; background:var(--bg); border-left:2px solid var(--accent); border-radius:4px;}
  .legal-note{font-size:12px; color:var(--muted); line-height:1.45; margin-top:6px; padding:7px 8px; background:var(--bg); border-left:2px solid var(--amber); border-radius:4px;}

  .notes{margin-top:12px;}
  .notes .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  .notes textarea{min-height:56px; resize:vertical;}

  footer{margin:22px 0 40px; padding-top:16px; border-top:1px solid var(--line);}
  footer .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  footer textarea{min-height:90px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
    background:var(--accent); color:var(--accent-fg); padding:10px 14px; border-radius:9px;
    font-size:13px; text-align:center; transform:translateY(80px); opacity:0; transition:all .25s; z-index:50;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  .toast.celebrate{background:var(--ok);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.3"/><line x1="12" y1="4" x2="12" y2="9.7"/><line x1="12" y1="14.3" x2="7.2" y2="18.5"/><line x1="12" y1="14.3" x2="16.8" y2="18.5"/></svg></div>
      <div>
        <h1>App Manejo</h1>
        <small id="stage-sub">Guía para aprender a conducir</small>
      </div>
      <button id="install-btn" hidden>Instalar</button>
    </div>
    <div class="profile-row">
      <label for="profile">Alumno</label>
      <select id="profile"></select>
      <input id="profile-new" type="text" placeholder="Nuevo alumno…" style="max-width:120px" hidden>
    </div>
    <div class="profile-row">
      <label for="country">País</label>
      <select id="country"></select>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="stage-progress">
    <div class="bar"><span id="stage-bar-fill" style="width:0%"></span></div>
    <b id="stage-bar-label">0/0</b>
  </div>

  <div id="modules"></div>

  <footer>
    <span class="vb-label">Notas generales de esta etapa (qué falta, qué agregar)</span>
    <textarea id="stage-notes" placeholder="Ej: falta un video de cómo reaccionar ante un retén…"></textarea>
    <div class="hint">Esto es una versión de prueba. Lo que escribas aquí y en cada módulo queda guardado en este teléfono para revisarlo juntos y decidir qué agregar.</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// Íconos de línea (24x24, trazo currentColor) para los encabezados de módulo.
const ICONS = {
  wheel:   `<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.3"/><line x1="12" y1="4" x2="12" y2="9.7"/><line x1="12" y1="14.3" x2="7.2" y2="18.5"/><line x1="12" y1="14.3" x2="16.8" y2="18.5"/>`,
  key:     `<circle cx="7" cy="12" r="3.2"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="16" y1="12" x2="16" y2="15"/><line x1="19" y1="12" x2="19" y2="14.5"/>`,
  sign:    `<path d="M12 4 L21 19 L3 19 Z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="16.8" r="0.9" fill="currentColor" stroke="none"/>`,
  light:   `<rect x="9" y="3" width="6" height="16" rx="3"/><circle cx="12" cy="7" r="1.3"/><circle cx="12" cy="11" r="1.3"/><circle cx="12" cy="15" r="1.3"/><line x1="12" y1="19" x2="12" y2="21"/>`,
  turn:    `<path d="M5 15 Q5 6 13 6 H17"/><path d="M14 3 L18 6 L14 9"/>`,
  idcard:  `<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5.5 16 Q8 13.2 10.5 16"/><line x1="13" y1="9" x2="18" y2="9"/><line x1="13" y1="13" x2="18" y2="13"/>`,
  city:    `<rect x="3" y="10" width="5" height="10"/><rect x="9.5" y="5" width="5" height="15"/><rect x="16" y="13" width="5" height="7"/>`,
  parking: `<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9.5 16.5V7.5h3.3a2.6 2.6 0 0 1 0 5.2H9.5" fill="none"/>`,
  flag:    `<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 12l2.3 2.3L16 9"/><line x1="8" y1="17" x2="16" y2="17"/>`,
  people:  `<circle cx="8.5" cy="8" r="2.6"/><path d="M3.5 19c0-3 2.2-5 5-5s5 2 5 5"/><circle cx="17" cy="9" r="2.1"/><path d="M14.5 19c0-2.4 1.7-4.2 4-4.2"/>`,
  weather: `<path d="M7 18h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.3A3.8 3.8 0 0 0 7 18Z"/>`,
  doc:     `<path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v4h4"/><line x1="9.5" y1="12" x2="15" y2="12"/><line x1="9.5" y1="15.5" x2="15" y2="15.5"/>`,
  shield:  `<path d="M12 3l7 3v6c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V6Z"/><path d="M9 12l2.2 2.2L15.5 9.5"/>`,
  highway: `<path d="M9 21 L10.5 3 M15 21 L13.5 3"/><line x1="12" y1="4" x2="12" y2="7"/><line x1="12" y1="10.5" x2="12" y2="13.5"/><line x1="12" y1="17" x2="12" y2="20"/>`,
  alert:   `<rect x="7" y="9" width="10" height="6" rx="1.5"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><line x1="12" y1="4" x2="12" y2="2.3"/><line x1="5" y1="18" x2="19" y2="18"/>`,
  mountain:`<path d="M3 19 L9 9 L13 15 L16 11 L21 19 Z"/>`,
  wrench:  `<path d="M20 5.5a4 4 0 0 1-5.4 5.4L8 17.5a2 2 0 1 1-2.8-2.8l6.6-6.6A4 4 0 0 1 17.2 3l-2.6 2.6 1.8 1.8L19 4.8Z"/>`,
  medal:   `<circle cx="12" cy="9" r="5.5"/><path d="M9 14l-1.5 6.5L12 18l4.5 2.5L15 14"/><path d="M9.5 9l1.8 1.8L15 7.3"/>`,
};
function iconSvg(name){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.wheel}</svg>`;
}

// Países soportados para las notas legales comparadas.
const COUNTRIES = {
  RD: "República Dominicana",
  US: "Estados Unidos",
  VE: "Venezuela",
  OCC: "Europa occidental (referencia)"
};

// Cada ítem del checklist es {text, tips}. "tips" es opcional y solo trae las
// claves de país (RD/US/VE/OCC) donde de verdad hay un consejo legal que dar;
// si un ítem no tiene nada especial por país (es una habilidad física, igual
// en cualquier lado), simplemente no lleva tips y no se muestra ninguna nota legal.
// "howto" SIEMPRE está presente: es la guía real, en tono neutral, pensada para
// que cualquier persona (no solo la familia del creador) sepa cómo hacer ese paso.
function I(text, howto, tips){ return { text, howto, tips: tips || null }; }

const CURRICULUM = {
  principiante: {
    label: "Principiante",
    modules: [
      { id:"p1", title:"El vehículo por dentro", icon:"wheel",
        checklist:[
          I("Identifica volante, pedales y palanca/automático",
            "Siéntate con el carro apagado y toca cada pedal con el pie (embrague si es manual, freno, acelerador). Ubica la palanca de cambios o el selector automático (P/R/N/D) antes de intentar arrancar."),
          I("Reconoce el tablero e indicadores",
            "Gira la llave o pulsa el botón de encendido sin arrancar el motor y observa qué luces se prenden (es normal por unos segundos). Identifica el velocímetro, el indicador de combustible y la luz de 'check engine' — si una luz queda encendida después de arrancar, no es normal."),
          I("Ajusta espejos y asiento",
            "Ajusta primero el asiento, después los espejos. El retrovisor central debe mostrar todo el vidrio trasero sin mover la cabeza; los espejos laterales, apenas el borde de tu propio carro — si ves mucho carro propio, ajústalos más hacia afuera."),
          I("Se abrocha el cinturón antes de todo",
            "Abróchalo antes de arrancar, nunca después. Debe quedar ajustado sobre la cadera y el hombro, nunca bajo el brazo ni detrás de la espalda.",
            {
              RD:"Es obligatorio por la Ley 63-17 para el conductor y todos los pasajeros.",
              US:"Es obligatorio en 49 de los 50 estados; solo New Hampshire no lo exige por ley a los adultos.",
              VE:"Es obligatorio por la Ley de Tránsito Terrestre para todos los ocupantes, no solo el conductor.",
              OCC:"Es obligatorio en toda la Unión Europea, incluidos los asientos traseros."
            }),
        ] },
      { id:"p2", title:"Antes de arrancar", icon:"key",
        checklist:[
          I("Completa el checklist pre-manejo (combustible, luces, llantas)",
            "Camina alrededor del carro antes de subir. Verifica que las 4 llantas no estén visiblemente bajas, prueba las luces direccionales y de freno (pide que alguien confirme desde afuera si es tu primera vez), y confirma que el tanque tenga combustible suficiente para toda la sesión."),
          I("Revisa frenos de mano y espejos",
            "Con el carro apagado, hala el freno de mano y confirma que sostiene el vehículo en una pendiente leve. Ajusta los espejos antes de arrancar, nunca en movimiento."),
          I("Arranca con la posición correcta al volante",
            "Espalda pegada al asiento, manos en las posiciones 9 y 3 del volante, brazos ligeramente doblados. Si tienes que estirarte para alcanzar el volante, el asiento está muy atrás."),
        ] },
      { id:"p3", title:"Señales de tránsito", icon:"sign",
        checklist:[
          I("Reconoce señales reglamentarias",
            "Identifica las formas base: triángulo = peligro/advertencia, octágono = alto total, círculo con borde rojo = prohibición. Practica nombrarlas en voz alta cuando las veas manejando, antes de reaccionar a ellas.",
            {
              RD:"La señalización dominicana sigue el modelo MUTCD de Estados Unidos (RD no firmó el Convenio de Viena) — te resultará familiar si alguna vez manejas allá.",
              US:"Se rige por el MUTCD; República Dominicana sigue un modelo muy similar, así que comparten casi el mismo lenguaje visual.",
              VE:"Venezuela es parte del Convenio de Viena sobre Señalización (tratado de la ONU), el mismo que sigue la mayoría de Europa occidental — reconocerás símbolos parecidos si cruzas a esos países.",
              OCC:"La mayoría de Europa occidental sigue el Convenio de Viena, igual que Venezuela — señalización muy parecida entre ambos, distinta a la de RD/EE.UU."
            }),
          I("Reconoce señales preventivas e informativas",
            "Las preventivas (forma de rombo en muchos países) avisan algo antes de que pase — una curva, un cruce escolar. Las informativas (rectangulares) te orientan: nombres de calles, distancias, servicios.",
            {
              RD:"Mismo estándar MUTCD que las reglamentarias — ver la nota del ítem anterior.",
              US:"Mismo estándar MUTCD que las reglamentarias — ver la nota del ítem anterior.",
              VE:"Sigue también el Convenio de Viena, compartido con la mayoría de Europa occidental.",
              OCC:"Sigue también el Convenio de Viena, compartido con Venezuela."
            }),
          I("Entiende las líneas y marcas viales",
            "Línea blanca continua: no cambiar de carril. Línea blanca discontinua: se puede cambiar con cuidado. Línea amarilla: separa sentidos opuestos. Doble línea continua: ningún sentido puede cruzar para adelantar."),
          I("Responde correctamente a los semáforos",
            "Verde: avanza si está despejado. Ámbar: detente si puedes hacerlo con seguridad, no aceleres para 'ganarle'. Rojo: alto total, incluso si no hay tráfico a la vista."),
        ] },
      { id:"p4", title:"Normas básicas de circulación", icon:"light",
        checklist:[
          I("Respeta el derecho de vía",
            "Antes de avanzar en un cruce, mira a ambos lados aunque tengas el paso — otro conductor puede no respetarlo. Ante la duda, cede tú primero.",
            {
              RD:"En cruces sin señalización clara, cede el paso al vehículo que viene por tu derecha; confirma siempre visualmente, no todos respetan la norma.",
              US:"En un cruce de 4 vías sin semáforo ('4-way stop'), pasa quien llegó primero; si llegan igual, cede el paso al que está a tu derecha — es una regla muy marcada en EE.UU.",
              VE:"Cede el paso al vehículo que viene por tu derecha cuando no hay señal que indique prioridad.",
              OCC:"En buena parte de Europa occidental rige la 'prioridad a la derecha': sin señal, cede el paso a quien viene por tu derecha."
            }),
          I("Mantiene el límite de velocidad",
            "Revisa el letrero de velocidad al entrar a una zona nueva (escuela, residencial, autopista) y ajusta tu velocidad antes de llegar al límite, no después.",
            {
              RD:"Los límites están en km/h.",
              US:"Los límites están en millas por hora (mph), no en km/h — si aprendiste pensando en km/h, ten cuidado con la conversión.",
              VE:"Los límites están en km/h.",
              OCC:"Los límites están en km/h, excepto en el Reino Unido, que usa mph."
            }),
          I("Guarda distancia de seguimiento",
            "Cuenta 2-3 segundos entre que el carro de adelante pasa un punto fijo (un poste, una señal) y tú pasas ese mismo punto. Si cuentas menos, estás muy cerca."),
          I("Usa direccionales y luces correctamente",
            "Enciende la direccional al menos 3 segundos antes de girar o cambiar de carril — no al mismo tiempo que haces el movimiento."),
        ] },
      { id:"p5", title:"Maniobras básicas en espacio controlado", icon:"turn",
        checklist:[
          I("Arranca y detiene el vehículo con suavidad",
            "Suelta el freno de forma progresiva mientras acelera poco a poco. Para frenar, reduce la presión gradualmente hasta casi detenerte, y presiona firme solo al final."),
          I("Gira a baja velocidad usando espejos",
            "Antes de girar, revisa el espejo del lado hacia el que vas a girar y confirma el punto ciego con un vistazo rápido, incluso a baja velocidad."),
          I("Revisa el punto ciego antes de moverse",

const STORE_KEY = "appmanejo_v1";
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
function saveStore(s){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
}
let store = loadStore();
store.profiles = store.profiles || ["Alumno 1"];
store.currentProfile = store.currentProfile || store.profiles[0];
store.progress = store.progress || {};          // {profile: {moduleId: {itemIndex: bool}}}
store.videos = store.videos || {};              // {moduleId: url}  (compartido entre alumnos)
store.moduleNotes = store.moduleNotes || {};     // {moduleId: text}
store.stageNotes = store.stageNotes || {};       // {stageKey: text}
store.currentStage = store.currentStage || "principiante";
store.country = store.country && COUNTRIES[store.country] ? store.country : "RD";
saveStore(store);

const el = (sel) => document.querySelector(sel);
const countrySel = el("#country");
const profileSel = el("#profile");
const tabsEl = el("#tabs");
const modulesEl = el("#modules");
const stageSub = el("#stage-sub");
const barFill = el("#stage-bar-fill");
const barLabel = el("#stage-bar-label");
const stageNotesEl = el("#stage-notes");
const toastEl = el("#toast");

function toast(msg, celebrate){
  toastEl.textContent = msg;
  toastEl.classList.toggle("celebrate", !!celebrate);
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>{ toastEl.classList.remove("show"); toastEl.classList.remove("celebrate"); }, celebrate ? 2200 : 1400);
}

function renderCountries(){
  countrySel.innerHTML = "";
  Object.keys(COUNTRIES).forEach(code=>{
    const o = document.createElement("option");
    o.value = code; o.textContent = COUNTRIES[code];
    if(code === store.country) o.selected = true;
    countrySel.appendChild(o);
  });
}

function renderProfiles(){
  profileSel.innerHTML = "";
  store.profiles.forEach(p=>{
    const o = document.createElement("option");
    o.value = p; o.textContent = p;
    if(p === store.currentProfile) o.selected = true;
    profileSel.appendChild(o);
  });
  const addOpt = document.createElement("option");
  addOpt.value = "__add__"; addOpt.textContent = "+ Agregar alumno";
  profileSel.appendChild(addOpt);
}

function renderTabs(){
  tabsEl.innerHTML = "";
  Object.keys(CURRICULUM).forEach(key=>{
    const t = document.createElement("div");
    t.className = "tab" + (key===store.currentStage ? " active" : "");
    t.textContent = CURRICULUM[key].label;
    t.onclick = ()=>{ store.currentStage = key; saveStore(store); renderAll(); };
    tabsEl.appendChild(t);
  });
}

function getProgressFor(profile, moduleId){
  store.progress[profile] = store.progress[profile] || {};
  store.progress[profile][moduleId] = store.progress[profile][moduleId] || {};
  return store.progress[profile][moduleId];
}

function stageStats(stageKey){
  const stage = CURRICULUM[stageKey];
  let total=0, done=0;
  stage.modules.forEach(m=>{
    const prog = getProgressFor(store.currentProfile, m.id);
    m.checklist.forEach((_,i)=>{ total++; if(prog[i]) done++; });
  });
  return {total, done};
}

function renderProgressBar(){
  const {total, done} = stageStats(store.currentStage);
  const pct = total ? Math.round((done/total)*100) : 0;
  barFill.style.width = pct + "%";
  barLabel.textContent = `${done}/${total}`;
  stageSub.textContent = `${store.currentProfile} · ${CURRICULUM[store.currentStage].label} · ${pct}% completado`;
}

let openModule = null;

function renderModules(){
  modulesEl.innerHTML = "";
  const stage = CURRICULUM[store.currentStage];
  stage.modules.forEach((m, idx)=>{
    const prog = getProgressFor(store.currentProfile, m.id);
    const doneCount = m.checklist.filter((_,i)=>prog[i]).length;
    const isComplete = doneCount === m.checklist.length;

    const wrap = document.createElement("div");
    wrap.className = "module" + (openModule===m.id ? " open" : "") + (isComplete ? " complete" : "");

    const head = document.createElement("div");
    head.className = "module-head";
    head.innerHTML = `
      <div class="icn">${iconSvg(m.icon)}</div>
      <div class="title">${m.title}</div>
      <div class="count">${isComplete ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>` : ""}${doneCount}/${m.checklist.length}</div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    `;
    head.onclick = ()=>{ openModule = (openModule===m.id ? null : m.id); renderModules(); };
    wrap.appendChild(head);

    const body = document.createElement("div");
    body.className = "module-body";

    const videoUrl = store.videos[m.id] || "";
    const vb = document.createElement("div");
    vb.className = "video-box" + (videoUrl ? " has-video" : "");
    vb.innerHTML = `
      <span class="vb-label">Video de la lección</span>
      ${videoUrl
        ? `<a class="vlink" href="${videoUrl}" target="_blank" rel="noopener">${videoUrl}</a>
           <div class="drive-warning">Repasa esto antes de subir al carro o después de la sesión — nunca mientras alguien está manejando. Si hace falta verlo a mitad de práctica, que lo haga el acompañante, no el alumno.</div>`
        : `<span class="pending">Video pendiente de grabar</span>`}
      <div class="vrow">
        <input type="url" placeholder="Pega el enlace del video al grabarlo…" value="${videoUrl}">
        <button type="button">Guardar</button>
      </div>
    `;
    const vinput = vb.querySelector("input");
    vb.querySelector("button").onclick = ()=>{
      store.videos[m.id] = vinput.value.trim();
      saveStore(store);
      toast("Video guardado");
      renderModules();
    };
    body.appendChild(vb);

    const ul = document.createElement("ul");
    ul.className = "checklist";
    m.checklist.forEach((item, i)=>{
      const li = document.createElement("li");
      if(prog[i]) li.classList.add("checked");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!prog[i];
      cb.id = `cb-${m.id}-${i}`;
      cb.onchange = ()=>{
        const wasComplete = m.checklist.every((_,k)=>prog[k]);
        prog[i] = cb.checked;
        const isNowComplete = m.checklist.every((_,k)=>prog[k]);
        saveStore(store);
        renderModules();
        renderProgressBar();
        if(isNowComplete && !wasComplete) toast(`Módulo dominado: ${m.title}`, true);
      };
      const textWrap = document.createElement("div");
      textWrap.style.minWidth = "0";
      const span = document.createElement("span");
      span.textContent = item.text;
      textWrap.appendChild(span);

      if(item.howto){
        const how = document.createElement("div");
        how.className = "howto-note";
        how.textContent = item.howto;
        textWrap.appendChild(how);
      }

      const countryTip = item.tips && item.tips[store.country];
      if(countryTip){
        const note = document.createElement("div");
        note.className = "legal-note";
        note.textContent = countryTip;
        textWrap.appendChild(note);
      }

      li.appendChild(cb); li.appendChild(textWrap);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    const notesWrap = document.createElement("div");
    notesWrap.className = "notes";
    notesWrap.innerHTML = `<span class="vb-label">Notas de este módulo</span>
      <textarea placeholder="Ej: agregar un ítem sobre uso del claxon…">${store.moduleNotes[m.id] || ""}</textarea>`;
    const ta = notesWrap.querySelector("textarea");
    ta.onblur = ()=>{ store.moduleNotes[m.id] = ta.value; saveStore(store); };
    body.appendChild(notesWrap);

    wrap.appendChild(body);
    modulesEl.appendChild(wrap);
  });
}

function renderStageNotes(){
  stageNotesEl.value = store.stageNotes[store.currentStage] || "";
}
stageNotesEl.addEventListener("blur", ()=>{
  store.stageNotes[store.currentStage] = stageNotesEl.value;
  saveStore(store);
});

profileSel.addEventListener("change", ()=>{
  if(profileSel.value === "__add__"){
    const name = prompt("Nombre del nuevo alumno:");
    if(name && name.trim()){
      const n = name.trim();
      if(!store.profiles.includes(n)) store.profiles.push(n);
      store.currentProfile = n;
      saveStore(store);
    }
  } else {
    store.currentProfile = profileSel.value;
    saveStore(store);
  }
  renderAll();
});

function renderAll(){
  renderCountries();
  renderProfiles();
  renderTabs();
  renderModules();
  renderProgressBar();
  renderStageNotes();
}
renderAll();

countrySel.addEventListener("change", ()=>{
  store.country = countrySel.value;
  saveStore(store);
  renderAll();
});

// --- Instalación PWA ---
let deferredInstall = null;
const installBtn = el("#install-btn");
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstall = e;
  installBtn.hidden = false;
});
installBtn.addEventListener("click", async ()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  installBtn.hidden = true;
});
window.addEventListener("appinstalled", ()=>{ toast("App instalada"); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
