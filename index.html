<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Manejo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#155e52">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App Manejo">
<style>
  :root{
    --bg:#f6f4ef; --surface:#ffffff; --fg:#17231f; --muted:#5b6b64;
    --line:#e1ddd2; --accent:#155e52; --accent-fg:#ffffff; --amber:#c98a1f;
    --ok:#2f7a4f; --pending:#9a9488;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1715; --surface:#172420; --fg:#eef1ee; --muted:#9cada3;
      --line:#28362f; --accent:#4fb3a0; --accent-fg:#0b1b17; --amber:#e3a84a;
      --ok:#5fbf84; --pending:#6b7772;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  .wrap{max-width:640px; margin:0 auto;}
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg); padding:14px 0 10px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px; height:34px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent-fg); font-weight:700;}
  .brand h1{font-size:17px; margin:0; letter-spacing:.2px;}
  .brand small{display:block; color:var(--muted); font-size:12px; margin-top:1px;}
  #install-btn{
    margin-left:auto; border:1px solid var(--accent); background:transparent; color:var(--accent);
    border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  #install-btn[hidden]{display:none;}

  .profile-row{display:flex; gap:8px; margin-top:12px; align-items:center;}
  .profile-row label{font-size:12px; color:var(--muted); white-space:nowrap;}
  select, input[type=text], input[type=url], textarea{
    font-family:inherit; font-size:14px; color:var(--fg); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%;
  }
  select{flex:1;}

  .tabs{display:flex; gap:6px; margin:14px 0 16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px;}
  .tab{flex:1; text-align:center; padding:8px 4px; border-radius:7px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; user-select:none;}
  .tab.active{background:var(--accent); color:var(--accent-fg);}

  .stage-progress{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .bar{flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .bar > span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s;}
  .stage-progress b{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .module{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .module-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
  .module-head .n{width:24px; height:24px; border-radius:7px; background:var(--line); color:var(--muted); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}
  .module-head .title{flex:1; min-width:0; font-size:14.5px; font-weight:600;}
  .module-head .count{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .chev{transition:transform .2s; color:var(--muted); flex:none;}
  .module.open .chev{transform:rotate(90deg);}
  .module-body{display:none; padding:0 14px 14px; border-top:1px solid var(--line);}
  .module.open .module-body{display:block;}

  .video-box{margin:12px 0; padding:10px; border:1px dashed var(--line); border-radius:9px; background:var(--bg);}
  .video-box.has-video{border-style:solid; border-color:var(--ok);}
  .video-box .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  .video-box a.vlink{color:var(--accent); font-weight:600; font-size:13.5px; word-break:break-all;}
  .video-box .pending{color:var(--pending); font-size:13px; font-style:italic;}
  .video-box .vrow{display:flex; gap:6px; margin-top:8px;}
  .video-box .vrow input{flex:1;}
  .video-box .vrow button{border:none; background:var(--accent); color:var(--accent-fg); border-radius:7px; padding:0 12px; font-size:12.5px; font-weight:600; cursor:pointer;}

  ul.checklist{list-style:none; margin:10px 0 0; padding:0;}
  ul.checklist li{display:flex; align-items:flex-start; gap:9px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.8px;}
  ul.checklist li:last-child{border-bottom:none;}
  ul.checklist input[type=checkbox]{width:18px; height:18px; margin-top:1px; accent-color:var(--accent); flex:none;}
  ul.checklist li.checked > div > span{color:var(--muted); text-decoration:line-through;}
  ul.checklist li > div{flex:1; min-width:0;}
  .legal-note{font-size:12px; color:var(--muted); line-height:1.45; margin-top:4px; padding:7px 8px; background:var(--bg); border-left:2px solid var(--line); border-radius:4px;}
  .legal-note .ln-tag{font-weight:700; color:var(--accent); font-size:10.5px; text-transform:uppercase; letter-spacing:.3px;}
  .legal-note .ln-tag.ln-country{color:var(--amber);}

  .notes{margin-top:12px;}
  .notes .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  .notes textarea{min-height:56px; resize:vertical;}

  footer{margin:22px 0 40px; padding-top:16px; border-top:1px solid var(--line);}
  footer .vb-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; display:block;}
  footer textarea{min-height:90px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
    background:var(--accent); color:var(--accent-fg); padding:10px 14px; border-radius:9px;
    font-size:13px; text-align:center; transform:translateY(80px); opacity:0; transition:all .25s; z-index:50;
  }
  .toast.show{transform:translateY(0); opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">AM</div>
      <div>
        <h1>App Manejo</h1>
        <small id="stage-sub">Guía para aprender a conducir</small>
      </div>
      <button id="install-btn" hidden>Instalar</button>
    </div>
    <div class="profile-row">
      <label for="profile">Alumno</label>
      <select id="profile"></select>
      <input id="profile-new" type="text" placeholder="Nuevo alumno…" style="max-width:120px" hidden>
    </div>
    <div class="profile-row">
      <label for="country">País</label>
      <select id="country"></select>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="stage-progress">
    <div class="bar"><span id="stage-bar-fill" style="width:0%"></span></div>
    <b id="stage-bar-label">0/0</b>
  </div>

  <div id="modules"></div>

  <footer>
    <span class="vb-label">Notas generales de esta etapa (qué falta, qué agregar)</span>
    <textarea id="stage-notes" placeholder="Ej: falta un video de cómo reaccionar ante un retén…"></textarea>
    <div class="hint">Esto es una versión de prueba. Lo que escribas aquí y en cada módulo queda guardado en este teléfono para revisarlo juntos y decidir qué agregar.</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// Países soportados para las notas legales comparadas.
const COUNTRIES = {
  RD: "República Dominicana",
  US: "Estados Unidos",
  VE: "Venezuela",
  OCC: "Europa occidental (referencia)"
};

// Cada ítem del checklist es {text, legal}. "legal.universal" siempre existe;
// las claves de país (RD/US/VE/OCC) solo aparecen cuando la ley realmente cambia.
function I(text, legal){ return { text, legal: legal || { universal: "No varía por país — es una habilidad de manejo, igual en cualquier lugar." } }; }

const CURRICULUM = {
  principiante: {
    label: "Principiante",
    modules: [
      { id:"p1", title:"El vehículo por dentro",
        checklist:[
          I("Identifica volante, pedales y palanca/automático", { universal:"No varía: la disposición de los controles es igual en todo país que conduce por la derecha (RD, EE.UU., Venezuela y casi toda Europa occidental)." }),
          I("Reconoce el tablero e indicadores"),
          I("Ajusta espejos y asiento"),
          I("Se abrocha el cinturón antes de todo", {
            universal:"El cinturón es obligatorio prácticamente en todo el mundo, pero la ley exacta cambia.",
            RD:"Ley 63-17: obligatorio para el conductor y todos los pasajeros.",
            US:"Obligatorio en 49 estados (la excepción es New Hampshire); multas y aplicación varían por estado.",
            VE:"Obligatorio por la Ley de Tránsito Terrestre para todos los ocupantes.",
            OCC:"Obligatorio en toda la Unión Europea, incluyendo asientos traseros."
          }),
        ] },
      { id:"p2", title:"Antes de arrancar",
        checklist:[
          I("Completa el checklist pre-manejo (combustible, luces, llantas)"),
          I("Revisa frenos de mano y espejos"),
          I("Arranca con la posición correcta al volante"),
        ] },
      { id:"p3", title:"Señales de tránsito",
        checklist:[
          I("Reconoce señales reglamentarias", {
            universal:"Las formas básicas (triángulo=peligro, octágono=alto, círculo=prohibición) se repiten en casi toda América.",
            RD:"RD no firmó el Convenio de Viena; su señalización sigue de cerca el MUTCD de EE.UU.",
            US:"Se rige por el MUTCD (Manual on Uniform Traffic Control Devices).",
            VE:"Venezuela sí es parte del Convenio de Viena sobre Señalización (ONU) — algunos símbolos pueden verse distintos a los de RD/EE.UU. aunque signifiquen lo mismo.",
            OCC:"La mayoría de Europa occidental sigue el Convenio de Viena, igual que Venezuela — señalización muy parecida entre ambos."
          }),
          I("Reconoce señales preventivas e informativas", { universal:"Aplica la misma división MUTCD vs. Convenio de Viena que en señales reglamentarias (ver ítem anterior)." }),
          I("Entiende las líneas y marcas viales", { universal:"Blanco y amarillo tienen el mismo significado general (carriles y sentidos) en los cuatro, con variaciones menores en el uso exacto del amarillo." }),
          I("Responde correctamente a los semáforos", { universal:"Verde, ámbar y rojo significan lo mismo en RD, EE.UU., Venezuela y Europa occidental." }),
        ] },
      { id:"p4", title:"Normas básicas de circulación",
        checklist:[
          I("Respeta el derecho de vía", { universal:"El principio general (ceder el paso según la situación) es compartido, pero las reglas exactas en cruces sin señal varían por país — conviene verificar el manual local." }),
          I("Mantiene el límite de velocidad", {
            universal:"¡Ojo con las unidades al cambiar de país!",
            RD:"Límites en km/h.",
            US:"Límites en millas por hora (mph) — el único de los cuatro que no usa km/h.",
            VE:"Límites en km/h.",
            OCC:"Límites en km/h (excepción: el Reino Unido usa mph)."
          }),
          I("Guarda distancia de seguimiento", { universal:"Mismo principio en todos lados (regla de los 2-3 segundos); es una práctica de seguridad, no varía por ley." }),
          I("Usa direccionales y luces correctamente"),
        ] },
      { id:"p5", title:"Maniobras básicas en espacio controlado",
        checklist:[
          I("Arranca y detiene el vehículo con suavidad"),
          I("Gira a baja velocidad usando espejos"),
          I("Revisa el punto ciego antes de moverse"),
        ] },
      { id:"p6", title:"Marco legal: carnet de aprendizaje",
        checklist:[
          I("Explica qué es el carnet de aprendizaje", {
            universal:"Concepto compartido (permiso provisional antes de la licencia definitiva); cada país le da su propio nombre y edad mínima. Edad mínima: RD 18, Venezuela 18, EE.UU. 16 (permiso de aprendizaje desde 14-15 según el estado), Europa occidental 17-18 según el país.",
            RD:"Carnet de aprendizaje, válido 6 meses, requiere acompañante con licencia de la misma categoría.",
            US:"Se llama 'learner's permit'; duración y reglas varían por estado.",
            VE:"Permiso equivalente regulado por el INTT (Instituto Nacional de Transporte Terrestre).",
            OCC:"Varios países de la UE tienen 'conducción acompañada' (ej. Francia desde los 15 años con un acompañante de 5+ años de experiencia)."
          }),
          I("Conoce las categorías de licencia (1, 2, 3, 4)", {
            universal:"Las categorías numeradas de RD/Venezuela no existen igual en EE.UU., que usa su propio sistema por estado.",
            RD:"1 motocicletas, 2 vehículos ligeros, 3-4 pesados (Ley 63-17).",
            US:"Varía por estado; comúnmente Class D (carro), Class M (moto), CDL (comercial).",
            VE:"Clasificación propia bajo la Ley de Tránsito Terrestre.",
            OCC:"La Unión Europea usa categorías armonizadas: AM, A1, A2, A, B, C, D, etc."
          }),
          I("Sabe que debe ir siempre con acompañante con licencia", {
            universal:"Principio compartido mientras se tiene el permiso provisional.",
            RD:"Obligatorio durante los 6 meses del carnet de aprendizaje, acompañante de la misma categoría.",
            US:"Varía por estado (período de manejo supervisado, a veces con horas mínimas registradas).",
            VE:"Exigido por el INTT.",
            OCC:"En países con conducción acompañada, el acompañante debe cumplir años mínimos de experiencia."
          }),
        ] },
    ]
  },
  intermedio: {
    label: "Intermedio",
    modules: [
      { id:"i1", title:"Manejo en vía urbana",
        checklist:[
          I("Cruza intersecciones con seguridad"),
          I("Maneja rotondas/glorietas", { universal:"El sentido de giro (antihorario) es igual en RD, EE.UU., Venezuela y la mayoría de Europa occidental porque todos conducen por la derecha. (Es al revés en países que conducen por la izquierda, como el Reino Unido.)" }),
          I("Cambia de carril verificando espejos y punto ciego"),
        ] },
      { id:"i2", title:"Estacionamiento",
        checklist:[
          I("Estaciona en paralelo"),
          I("Estaciona en reversa"),
          I("Estaciona en línea/diagonal"),
        ] },
      { id:"i3", title:"Maniobras del examen práctico",
        checklist:[
          I("Usa direccionales en el momento correcto", { universal:"El formato exacto del examen práctico varía por autoridad: INTRANT (RD), DMV de cada estado (EE.UU.), INTT (Venezuela) — las maniobras base evaluadas son similares." }),
          I("Controla velocidad en curvas"),
          I("Frena de forma controlada"),
          I("Arranca en pendiente sin retroceder"),
        ] },
      { id:"i4", title:"Interacción con otros actores",
        checklist:[
          I("Guarda distancia de motociclistas"),
          I("Cede el paso a peatones"),
          I("Respeta a ciclistas y transporte público", { universal:"Guardar distancia de ciclistas es universal; algunos países fijan una distancia mínima exacta por ley (ej. España exige 1.5m), mientras que RD, Venezuela y EE.UU. lo dejan como norma general sin metro exacto — aplícalo igual como mínimo." }),
        ] },
      { id:"i5", title:"Condiciones variables",
        checklist:[
          I("Maneja de noche con confianza", { universal:"El uso de luces de día (DRL) es obligatorio por ley en buena parte de Europa; en RD, EE.UU. y Venezuela no es obligatorio pero es buena práctica." }),
          I("Maneja con lluvia leve"),
          I("Identifica y evita baches a tiempo"),
        ] },
      { id:"i6", title:"Documentación y responsabilidad",
        checklist:[
          I("Sabe qué documentos llevar", {
            universal:"Licencia + documentos del vehículo + seguro son la base en los cuatro; cambia el nombre y el tipo de seguro exigido.",
            RD:"Licencia, matrícula y seguro obligatorio.",
            US:"Licencia, registro (registration) y prueba de seguro — el mínimo exigido varía por estado.",
            VE:"Licencia, certificado de circulación y seguro obligatorio del vehículo.",
            OCC:"Licencia, documentación del vehículo y el 'certificado verde' de seguro reconocido en la UE."
          }),
          I("Sabe qué hacer en un retén", {
            universal:"Mantener la calma, documentos a mano, seguir instrucciones del agente — igual en todos lados.",
            RD:"Retenes a cargo de AMET/DIGESETT.",
            US:"Se llama 'traffic stop'; procedimiento y derechos del conductor varían por estado.",
            VE:"Alcabalas, a cargo de tránsito terrestre.",
            OCC:"Controles de tránsito regulados por cada país de la UE."
          }),
          I("Sabe qué hacer ante un accidente menor", { universal:"El procedimiento base (seguridad primero, triángulos, fotos, reporte) es igual; lo que cambia es a quién llamar y si el reporte es obligatorio por ley en ese país." }),
        ] },
    ]
  },
  avanzado: {
    label: "Avanzado",
    modules: [
      { id:"a1", title:"Manejo defensivo",
        checklist:[
          I("Anticipa riesgos antes de que ocurran"),
          I("Calcula distancia de frenado según velocidad"),
          I("Mantiene la calma ante conductores agresivos"),
        ] },
      { id:"a2", title:"Vías de alta velocidad",
        checklist:[
          I("Se incorpora a la autopista con seguridad", {
            universal:"El concepto es igual; los límites numéricos cambian bastante entre países.",
            RD:"Autopistas como Duarte o Las Américas: límites típicos entre 80-100 km/h.",
            US:"Interestatales entre 55-80 mph (≈ 90-130 km/h) según el estado.",
            VE:"Autopistas con límites típicos alrededor de 100-120 km/h.",
            OCC:"Autopistas europeas suelen ir de 120 a 130 km/h; Alemania es la excepción famosa, con tramos de su Autobahn sin límite de velocidad."
          }),
          I("Adelanta de forma segura"),
          I("Usa el carril izquierdo correctamente"),
        ] },
      { id:"a3", title:"Emergencias",
        checklist:[
          I("Sabe qué hacer ante un pinchazo"),
          I("Reconoce sobrecalentamiento del motor"),
          I("Sabe reaccionar si fallan los frenos"),
          I("Coloca triángulos/luces de emergencia", {
            universal:"Tener elementos de emergencia a bordo es buena práctica en todos lados, pero no siempre es obligatorio por ley.",
            RD:"Exigido como parte de la inspección vehicular.",
            US:"No es obligatorio por ley en la mayoría de los estados, aunque se recomienda.",
            VE:"Exigido como parte de la inspección vehicular.",
            OCC:"En la UE, llevar triángulo reflectante (y en varios países también chaleco reflectante) es obligatorio por ley."
          }),
        ] },
      { id:"a4", title:"Condiciones difíciles",
        checklist:[
          I("Maneja en zona montañosa"),
          I("Maneja en hora pico/ciudad congestionada"),
          I("Maneja cruces sin semáforo"),
        ] },
      { id:"a5", title:"Eficiencia y mantenimiento",
        checklist:[
          I("Aplica manejo económico"),
          I("Reconoce señales de que el carro necesita mecánico", {
            universal:"El mantenimiento preventivo no depende de la ley, pero la inspección vehicular obligatoria sí varía por país.",
            RD:"Inspección técnica vehicular exigida por INTRANT.",
            US:"Varía por estado; algunos no exigen inspección periódica.",
            VE:"Revisión exigida, con cumplimiento variable según la zona.",
            OCC:"La ITV (o equivalente) es obligatoria y estricta en casi toda la UE."
          }),
        ] },
      { id:"a6", title:"Preparación final para el examen",
        checklist:[
          I("Aprueba el simulacro teórico (≥90%)"),
          I("Aprueba el simulacro práctico completo"),
          I("Sabe qué esperar el día del examen", {
            universal:"El contenido de manejo es el mismo; cambia la autoridad que certifica.",
            RD:"INTRANT.",
            US:"DMV de cada estado.",
            VE:"INTT.",
            OCC:"Autoridad de tránsito de cada país (ej. DGT en España)."
          }),
        ] },
    ]
  }
};

const STORE_KEY = "appmanejo_v1";
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
function saveStore(s){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
}
let store = loadStore();
store.profiles = store.profiles || ["Alumno 1"];
store.currentProfile = store.currentProfile || store.profiles[0];
store.progress = store.progress || {};          // {profile: {moduleId: {itemIndex: bool}}}
store.videos = store.videos || {};              // {moduleId: url}  (compartido entre alumnos)
store.moduleNotes = store.moduleNotes || {};     // {moduleId: text}
store.stageNotes = store.stageNotes || {};       // {stageKey: text}
store.currentStage = store.currentStage || "principiante";
store.country = store.country && COUNTRIES[store.country] ? store.country : "RD";
saveStore(store);

const el = (sel) => document.querySelector(sel);
const countrySel = el("#country");
const profileSel = el("#profile");
const tabsEl = el("#tabs");
const modulesEl = el("#modules");
const stageSub = el("#stage-sub");
const barFill = el("#stage-bar-fill");
const barLabel = el("#stage-bar-label");
const stageNotesEl = el("#stage-notes");
const toastEl = el("#toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 1400);
}

function renderCountries(){
  countrySel.innerHTML = "";
  Object.keys(COUNTRIES).forEach(code=>{
    const o = document.createElement("option");
    o.value = code; o.textContent = COUNTRIES[code];
    if(code === store.country) o.selected = true;
    countrySel.appendChild(o);
  });
}

function renderProfiles(){
  profileSel.innerHTML = "";
  store.profiles.forEach(p=>{
    const o = document.createElement("option");
    o.value = p; o.textContent = p;
    if(p === store.currentProfile) o.selected = true;
    profileSel.appendChild(o);
  });
  const addOpt = document.createElement("option");
  addOpt.value = "__add__"; addOpt.textContent = "+ Agregar alumno";
  profileSel.appendChild(addOpt);
}

function renderTabs(){
  tabsEl.innerHTML = "";
  Object.keys(CURRICULUM).forEach(key=>{
    const t = document.createElement("div");
    t.className = "tab" + (key===store.currentStage ? " active" : "");
    t.textContent = CURRICULUM[key].label;
    t.onclick = ()=>{ store.currentStage = key; saveStore(store); renderAll(); };
    tabsEl.appendChild(t);
  });
}

function getProgressFor(profile, moduleId){
  store.progress[profile] = store.progress[profile] || {};
  store.progress[profile][moduleId] = store.progress[profile][moduleId] || {};
  return store.progress[profile][moduleId];
}

function stageStats(stageKey){
  const stage = CURRICULUM[stageKey];
  let total=0, done=0;
  stage.modules.forEach(m=>{
    const prog = getProgressFor(store.currentProfile, m.id);
    m.checklist.forEach((_,i)=>{ total++; if(prog[i]) done++; });
  });
  return {total, done};
}

function renderProgressBar(){
  const {total, done} = stageStats(store.currentStage);
  const pct = total ? Math.round((done/total)*100) : 0;
  barFill.style.width = pct + "%";
  barLabel.textContent = `${done}/${total}`;
  stageSub.textContent = `${store.currentProfile} · ${CURRICULUM[store.currentStage].label} · ${pct}% completado`;
}

let openModule = null;

function renderModules(){
  modulesEl.innerHTML = "";
  const stage = CURRICULUM[store.currentStage];
  stage.modules.forEach((m, idx)=>{
    const prog = getProgressFor(store.currentProfile, m.id);
    const doneCount = m.checklist.filter((_,i)=>prog[i]).length;

    const wrap = document.createElement("div");
    wrap.className = "module" + (openModule===m.id ? " open" : "");

    const head = document.createElement("div");
    head.className = "module-head";
    head.innerHTML = `
      <div class="n">${idx+1}</div>
      <div class="title">${m.title}</div>
      <div class="count">${doneCount}/${m.checklist.length}</div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    `;
    head.onclick = ()=>{ openModule = (openModule===m.id ? null : m.id); renderModules(); };
    wrap.appendChild(head);

    const body = document.createElement("div");
    body.className = "module-body";

    const videoUrl = store.videos[m.id] || "";
    const vb = document.createElement("div");
    vb.className = "video-box" + (videoUrl ? " has-video" : "");
    vb.innerHTML = `
      <span class="vb-label">Video de la lección</span>
      ${videoUrl
        ? `<a class="vlink" href="${videoUrl}" target="_blank" rel="noopener">${videoUrl}</a>`
        : `<span class="pending">Video pendiente de grabar</span>`}
      <div class="vrow">
        <input type="url" placeholder="Pega el enlace del video al grabarlo…" value="${videoUrl}">
        <button type="button">Guardar</button>
      </div>
    `;
    const vinput = vb.querySelector("input");
    vb.querySelector("button").onclick = ()=>{
      store.videos[m.id] = vinput.value.trim();
      saveStore(store);
      toast("Video guardado");
      renderModules();
    };
    body.appendChild(vb);

    const ul = document.createElement("ul");
    ul.className = "checklist";
    m.checklist.forEach((item, i)=>{
      const li = document.createElement("li");
      if(prog[i]) li.classList.add("checked");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!prog[i];
      cb.id = `cb-${m.id}-${i}`;
      cb.onchange = ()=>{
        prog[i] = cb.checked;
        saveStore(store);
        renderModules();
        renderProgressBar();
      };
      const textWrap = document.createElement("div");
      textWrap.style.minWidth = "0";
      const span = document.createElement("span");
      span.textContent = item.text;
      textWrap.appendChild(span);

      const legal = item.legal || {};
      const countryNote = legal[store.country];
      if(legal.universal || countryNote){
        const note = document.createElement("div");
        note.className = "legal-note";
        let html = "";
        if(legal.universal) html += `<span class="ln-tag">Todos</span> ${legal.universal}`;
        if(countryNote) html += `${html ? "<br>" : ""}<span class="ln-tag ln-country">${COUNTRIES[store.country]}</span> ${countryNote}`;
        note.innerHTML = html;
        textWrap.appendChild(note);
      }

      li.appendChild(cb); li.appendChild(textWrap);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    const notesWrap = document.createElement("div");
    notesWrap.className = "notes";
    notesWrap.innerHTML = `<span class="vb-label">Notas de este módulo</span>
      <textarea placeholder="Ej: agregar un ítem sobre uso del claxon…">${store.moduleNotes[m.id] || ""}</textarea>`;
    const ta = notesWrap.querySelector("textarea");
    ta.onblur = ()=>{ store.moduleNotes[m.id] = ta.value; saveStore(store); };
    body.appendChild(notesWrap);

    wrap.appendChild(body);
    modulesEl.appendChild(wrap);
  });
}

function renderStageNotes(){
  stageNotesEl.value = store.stageNotes[store.currentStage] || "";
}
stageNotesEl.addEventListener("blur", ()=>{
  store.stageNotes[store.currentStage] = stageNotesEl.value;
  saveStore(store);
});

profileSel.addEventListener("change", ()=>{
  if(profileSel.value === "__add__"){
    const name = prompt("Nombre del nuevo alumno:");
    if(name && name.trim()){
      const n = name.trim();
      if(!store.profiles.includes(n)) store.profiles.push(n);
      store.currentProfile = n;
      saveStore(store);
    }
  } else {
    store.currentProfile = profileSel.value;
    saveStore(store);
  }
  renderAll();
});

function renderAll(){
  renderCountries();
  renderProfiles();
  renderTabs();
  renderModules();
  renderProgressBar();
  renderStageNotes();
}
renderAll();

countrySel.addEventListener("change", ()=>{
  store.country = countrySel.value;
  saveStore(store);
  renderAll();
});

// --- Instalación PWA ---
let deferredInstall = null;
const installBtn = el("#install-btn");
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstall = e;
  installBtn.hidden = false;
});
installBtn.addEventListener("click", async ()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  installBtn.hidden = true;
});
window.addEventListener("appinstalled", ()=>{ toast("App instalada"); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
